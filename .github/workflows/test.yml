name: test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SwiftPM rebuilds by content, so a restored .build compiles only what
      # changed (Lua and musl are most of the build).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ThrowingWoodKit/.build
          key: kit-${{ runner.os }}-${{ hashFiles('ThrowingWoodKit/Package.swift', 'ThrowingWoodKit/Sources/**', 'ThrowingWoodKit/Tests/**') }}
          restore-keys: kit-${{ runner.os }}-
      # SwiftPM rebuilds code by content but never removes a resource folder that
      # Package.swift stopped copying: a cache from before such a change would keep it in
      # the built bundles (in 2026-11, the dropped engines 0.9, 0.8 and 0.7 stayed in
      # ThrowingWoodKit_KubbEngine.bundle). Resources are cheap to copy again, so every
      # built resource bundle goes; the vendor check below fails on any that stays.
      - name: Drop built resource bundles from the cache
        run: find ThrowingWoodKit/.build -type d -name 'ThrowingWoodKit_*.bundle' -prune -exec rm -rf {} + 2>/dev/null || true
      # The vendored engine must be the kubb-engine release scripts/vendor-engine.sh
      # names, every file as its engine.json says, byte for byte.
      - name: Vendored engine matches its manifest
        run: scripts/vendor-engine.sh check
      - name: Version arithmetic
        run: scripts/version.sh test
      # The golden tests: every hash the same as kubb-engine's golden corpus.
      # test-watch.sh prints where a stalled run is stuck: swift test holds its
      # output until the process ends.
      - name: ThrowingWoodKit tests
        run: scripts/test-watch.sh swift test --package-path ThrowingWoodKit
      # TestFlight builds are optimized; the hashes must hold there too.
      - name: ThrowingWoodKit tests, optimized
        run: scripts/test-watch.sh swift test -c release -Xswiftc -enable-testing --package-path ThrowingWoodKit
      # Neither build of the engine's C calls Apple's libm.
      - name: No Apple libm in CLua or CMusl
        run: scripts/check-libm.sh
      - name: Build the app for the simulator
        run: >
          xcodebuild -project ThrowingWood.xcodeproj -scheme ThrowingWood
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build
